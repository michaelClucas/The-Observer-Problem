    - arXiv:0803.1663    # API metadata and journal_ref
    - arXiv:2304.10258   # API metadata and journal_ref

retrieval_method:
  tools_available:
    - WebFetch
    - WebSearch
    - Agent (subagents)
    - Read/Write/Bash
  network_from_shell: >
    Unavailable. curl returned zero bytes both inside and outside the
    sandbox, so all retrieval went through WebFetch. Structural analysis of
    the staged files was done locally in Python.
  batching: >
    Locator existence was resolved in batches rather than one fetch per
    locator: ten arXiv Atom API id_list queries (14 ids each) and seven
    Crossref filter=doi queries (9-12 DOIs each). Each query named its
    requested identifiers and asked explicitly which returned no entry,
    because both APIs drop unmatched identifiers silently rather than
    erroring. Two Crossref batches returned HTTP 429 and succeeded on retry.

  delegation:
    subagents_used: 5
    subagent_purpose: >
      Retrieval legwork on five multi-paper content questions, run in
      parallel while the adversary read the target's prose: the Freivogel
      measure equivalences, the CSL bound discrepancy, the no-boundary
      exponent-sign attribution, the PW=CLPW dictionary, and the
      Gibbons-Hawking Everett-Wheeler remark.
    verdict_ownership: >
      No subagent claim was passed through unchecked. Every quotation and
      every negative result that appears in a reported finding was re-fetched
      by the adversary directly before being used. Specifically re-verified
      by the adversary: Freivogel section 5's two conditional clauses and the
      absence of equations there; the absence of any 10^-90 figure and of any
      numerical lambda bound in arXiv:1906.04405; the presence of both
      figures and the absence of "97 orders of magnitude" in
      arXiv:2102.07688; the "agrees with Vilenkin's tunneling proposal"
      sentence in arXiv:1703.02076 section I; the absence of Picard,
      Lefschetz and "inflation" in arXiv:gr-qc/9403010; the Everett-Wheeler
      sentence in the APS abstract of PhysRevD.15.2738; Wallace's footnote 4
      and sections 3.1/4.2; and the arXiv:2405.00114 abstract's "informal
      slogan" and "generalising previous approaches" wording.
    rationale: >
      The target run has on record that it caught one of its own subagents
      misreporting a paper's content, and that episode is the main argument
      in this repository for keeping verification un-delegated. This pass
      treated subagent output as candidate leads only.
    one_subagent_claim_not_adopted: >
      A subagent reported, from the body of arXiv:1912.00033, that the
      trinity equivalence's hypothesis is a non-degenerate continuous
      spectrum with boundedness explicitly immaterial. The adversary could
      verify only the abstract, which states no spectral condition at all.
      That claim was therefore NOT adopted as CONFIRMED; it is reported as
      PLAUSIBLE finding P-1 with the unperformed check named.

self_review_comparison:
  read_after_parts_1_to_3: true
  self_review_total: 12
  adversary_total: 11
  axes_agreeing: 4
  axes_diverging: 1
  diverging_axis: conflict_rigour
  self_review_scored_itself_generously: false
  headline: >
    The self-review scored itself 12/15 against an independent 11/15, with
    four of five axes matching exactly. It is not a generously self-scored
    run. It volunteered a schema violation of its own, a caught subagent
    error, two coverage holes, a specific calibration failure, and the
    contamination that invalidates its own best score as a method result;
    and its statement that prose/JSON agreement was "believed, not verified
    exhaustively" and that "a divergence is possible and would be a review
    finding" predicts findings C-3, C-5, C-6 and C-7 in advance.
  agreement_discount: >
    Agreement between this pass and the self-review is weak evidence: the
    target ran on a context forked from the session that wrote the seed, and
    the adversary's staged inputs came from that same author's repository.
    Part 4 section 4.3 states per axis whether the agreement is held from
    the adversary's own retrieval or from the self-review's argument. The
    axis-4 agreement in particular rests on non-overlapping evidence bases
    and should carry close to no weight.
  axis_1_note: >
    Same number, opposite directions. The self-review capped itself at 2
    because it could not distinguish a subagent fetching a locator from a
    subagent saying it fetched one, across roughly 150 locators. This pass
    closed that gap in the run's favour by fetching all 210 itself. The
    score holds at 2 only because this pass found a different defect the
    self-review does not name.
  finding_the_adversary_missed: >
    The self-review names a miscalibration this pass did not find: several
    slots tagged SOURCED as silence where the underlying read was truncated,
    with only B4's S4 correctly downgraded to LEAD. Not verified by this
    pass and not asserted; recorded because it is checkable from the
    target's own Part 6 and it cuts against the run.

method_findings:
  - id: M-1
    about: prompts/02-adversary.md
    about_the_target_run: false
    verdict: CONFIRMED
    summary: >
      Attack surface S-7 is unworkable as specified. It asks the adversary to
      check the target against a known-gaps list that exists only inside
      docs/approach-clusters.md, which the same prompt withholds. Not a
      budget limitation; unworkable for any adversary obeying the prompt.
    handling: >
      Reported as zero findings with the limit stated in Part 2 section 2.7
      and listed in Part 5 among surfaces this pass could not cover,
      attributed to the prompt. The withheld file was not requested and the
      gap was not worked around.
    proposed_fix: >
      Fork the prompt to a new number per protocol/METHOD.md: either stage
      the known-gaps list separately from the seed's cluster map, or move
      S-7 to the human reviewer who holds the seed.
    note: >
      Identified by the operator on reading Parts 1-3; recorded as a result
      this run produced.

