    - arXiv:2112.12828   # metadata, cross-confirmed via Crossref
    - arXiv:1105.0244    # section 5 and section 3.2, via ar5iv
    - arXiv:1906.04405   # full-text search for numerical bounds, via ar5iv
    - arXiv:2102.07688   # abstract and full text, via arXiv and ar5iv
    - arXiv:1703.02076   # abstract and section I, via ar5iv
    - arXiv:gr-qc/9403010 # full-text search, via ar5iv
    - arXiv:0712.0149    # footnotes and sections 2.3, 3.1, 3.3, 4.2, via ar5iv
    - arXiv:2405.00114   # abstract, via arXiv
    - arXiv:1912.00033   # abstract and listing only; body NOT read, see P-1
    - doi:10.1103/PhysRevD.15.2738  # publisher abstract, APS
