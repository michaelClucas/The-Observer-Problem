  extraction_note: >
    A first-pass DOI regex required a colon after "doi" and missed eight DOIs
    written as "related DOI 10.xxxx/..." without one. The pattern was
    loosened and the eight were fetched. The 77 figure is after that fix.

  non_identifier_locators_not_counted: >
    Three web locators (two Stanford Encyclopedia entries,
    anthropic-principle.com/phd/phdhtml) plus a number of pre-arXiv journal
    volume-and-page references and two book records (Barrow & Tipler 1986,
    Wheeler 1968) that carry no DOI. These were checked where they
    underwrote a finding and are not included in the 210.

  content_verification:
    swept: false
    sampled: true
    works_read_at_claim_level: 14
    distinct_works_cited_approx: 150
    fraction_approx: 0.09
    unsampled_remainder_approx: 136
    sampling_method: |
      Purposive, not random. Selected:
        (a) the two locators target/META.yaml asserts;
        (b) every locator underwriting a notational_variant verdict or a
            differs_in value that the structural audit of OUTPUT.json had
            flagged as suspect;
        (c) the three discrepancies the operator supplied as leads;
        (d) the places where the target's own tagging was most load-bearing
            or most self-hedged (its [LEAD] on Gibbons & Hawking 1977, its
            [SOURCED] on a review's assertion, its own citation correction).
    unsampled_remainder_detail: >
      Roughly 136 cited works were not read at claim level, including most of
      clusters A, C and D and the Bostrom and Barrow-Tipler material in
      cluster E1. For those works this pass establishes that the locator
      exists and is the work attributed, and nothing about whether it says
      what the target claims.
    carried_into_scores: >
      Stated in Part 2 section 2.4 and carried into the adversary's own
      citation-integrity (2) and calibration (2) scores. Axis 1 is reported
      as not capped at 0 on the basis of the complete existence sweep, which
      is the only claim the sweep supports; a content-level fabrication in
      the unsampled remainder would not have been caught by this pass.

  works_read_at_claim_level:
