isolation:
  enforced_by: file staging
  enforced_by_instruction: false
  note: |
    The adversary ran in a staging directory that was its entire view of the
    project. It had no git access and no repository checkout, so the withheld
    files were not reachable rather than merely forbidden. This run can
    therefore state plainly that it did not read the withheld seed material.
  fresh_context: true
  forked_from_target: false
  inherited_target_reasoning: false

files_withheld:
  - path: docs/approach-clusters.md
    reason: >
      The hand-written seed cluster map the target run was asked to correct.
      An adversary holding the seed mistakes seed agreement for verification.
    consequence_for_this_run: >
      Surface S-7 (silent coverage gaps) could not be covered at all,
      because the known-gaps list it asks the adversary to check against
      exists only in this withheld file. Reported as zero findings with the
      limit stated in Part 2 section 2.7, listed in Part 5 among surfaces
      not covered, and recorded as method finding M-1 against the prompt
      rather than against the target run. This is a defect in
      prompts/02-adversary.md, not a budget limitation: the surface is
      unworkable for any adversary obeying the prompt. The withheld file was
      not requested and the gap was not worked around.
  - path: target/REVIEW.md
    reason: >
      The target's self-review. Withheld until Parts 1-3 were written, so the
      adversary's rubric scores were formed independently.
    supplied_later: true
    supplied_when: after Parts 1-3 were written and saved to out/
    used_for: Part 4 only
    scores_revised_after_reading: none, in either direction
  - path: sources/bibliography.md
    reason: >
      The unverified seed bibliography. Part of the seed; would have supplied
      unretrieved leads as though they were a reading list.

staged_anchoring_risk:
  disclosed_in: INPUTS.md
  risk: >
    target/META.yaml asserts under CARTOGRAPHER-OWNED VERIFICATION that
    arXiv:2206.10780 and arXiv:2112.12828 are correct, with titles, authors
    and DOIs. That is a claim by the run under attack, not an established
    fact. Accepting it unchecked would itself have been a finding about this
    adversarial pass.
  handled_how: >
    Both identifiers were re-fetched by the adversary directly, through the
    arXiv Atom API, before reading the target's Cluster F, and
    cross-confirmed through Crossref. Treated as claims throughout.
  result: >
    Both assertions are correct in every asserted particular, including the
    v5 date for 2206.10780 and both DOIs. Reported as a clean result in
    Part 2 section 2.2 rather than relied on silently.

